{% extends "base_menu.html" %}
{% load crispy_forms_tags %}
{% block content %}
<p>
  <form action="" method="post" id="upload_form" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit">
    <input type="submit" value="Cancel" 
    data-url="{% url 'mov:all' %}"
    onclick="window.location.href=this.dataset.url;return false;">
  </form>
</p>
<!-- https://stackoverflow.com/questions/2472422/django-file-upload-size-limit -->
<script>
document.getElementById("upload_form").addEventListener("submit", function (event) {
    console.log("Checking file size");
    const formEl = document.getElementById("upload_form");
    const maxSize = parseInt(formEl.dataset.maxSize);
    const maxSizeText = formEl.dataset.maxSizeText;

    if (window.File && window.FileReader && window.FileList && window.Blob) {

        var fileInput = document.getElementById("id_{{ form.upload_field_name }}");
        var file = fileInput.files[0];

        if (file && file.size > maxSize) {
            alert(
                "File " + file.name +
                " of type " + file.type +
                " must be < "+maxSizeText
            );

            event.preventDefault();
            return false;
        }
    }
});
</script>
{% endblock %}
